name: Update Dashboard

on:
  # PRIMARY trigger: workflow_dispatch from an external scheduler (cron-job.org) at exact ET
  # times — see SCHEDULE.md. GitHub's own `schedule` is
  # best-effort: in Sep/Oct 2026 the 09:17/10:47 UTC runs landed 4-7h late or not at all,
  # so the morning brief read a mid-game fetch from the previous evening.
  workflow_dispatch:
    inputs:
      reason:
        description: "Which brief this fetch feeds (morning / goalie / sunday / manual)"
        required: false
        default: manual
  schedule:
    # FALLBACK only. If the external scheduler is down this still produces a fetch eventually;
    # the brief gate (scripts/agm_gate.py) rejects it if it lands too late or mid-game.
    - cron: '23 8 * * *'     # 08:23 UTC = 4:23am EDT / 3:23am EST

concurrency:
  group: update-dashboard
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch in-season data (AGM)
        id: inseason
        env:
          YAHOO_CLIENT_ID:     ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          AGM_TRIGGER:         ${{ github.event_name }}:${{ inputs.reason || 'schedule' }}
        run: python3 scripts/fetch_inseason.py

      - name: Fetch history and rebuild dashboard
        env:
          YAHOO_CLIENT_ID:     ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python3 run.py

      - name: Commit updated files
        # Commit whatever succeeded, even if the dashboard step failed
        if: always() && steps.inseason.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/league_cache.json data/inseason
          git diff --staged --quiet \
            || git commit -m "chore: update dashboard data (${{ inputs.reason || 'schedule' }}) [skip ci]"
          # Retry: a code push landing mid-run shouldn't lose the fetch
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Fail loudly if in-season endpoints failed
        if: steps.inseason.outcome == 'success'
        run: |
          python3 - <<'EOF'
          import json, sys
          m = json.load(open("data/inseason/manifest.json"))
          errs = m.get("errors", {})
          if errs:
              print("In-season endpoints failed:", ", ".join(errs))
              sys.exit(1)
          print(f"All {len(m['ok'])} in-season endpoints OK")
          EOF
