name: Update Dashboard

on:
  schedule:
    # Off-the-hour minutes: GitHub delays top-of-hour crons by hours, and sometimes skips runs.
    # Times below are EDT (UTC-4); in EST (from Nov) each lands one hour earlier in ET.
    # 09:17 UTC = 5:17am ET (after overnight games settle; on Sundays, after the 3am ET add reset)
    - cron: '17 9 * * *'
    # 10:47 UTC = 6:47am ET (second chance before the ~7:50am AGM morning brief)
    - cron: '47 10 * * *'
    # 19:47 UTC = 3:47pm ET (feeds the ~4:50pm AGM goalie check; catches afternoon moves)
    - cron: '47 19 * * *'
  workflow_dispatch:
    # Manual: Actions tab → Update Dashboard → Run workflow, or `gh workflow run update.yml`

concurrency:
  group: update-dashboard
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch in-season data (AGM)
        id: inseason
        env:
          YAHOO_CLIENT_ID:     ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python3 scripts/fetch_inseason.py

      - name: Fetch history and rebuild dashboard
        env:
          YAHOO_CLIENT_ID:     ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python3 run.py

      - name: Commit updated files
        # Commit whatever succeeded, even if the dashboard step failed
        if: always() && steps.inseason.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/league_cache.json data/inseason
          git diff --staged --quiet \
            || git commit -m "chore: update dashboard data [skip ci]"
          git pull --rebase
          git push

      - name: Fail loudly if in-season endpoints failed
        if: steps.inseason.outcome == 'success'
        run: |
          python3 - <<'EOF'
          import json, sys
          m = json.load(open("data/inseason/manifest.json"))
          errs = m.get("errors", {})
          if errs:
              print("In-season endpoints failed:", ", ".join(errs))
              sys.exit(1)
          print(f"All {len(m['ok'])} in-season endpoints OK")
          EOF
